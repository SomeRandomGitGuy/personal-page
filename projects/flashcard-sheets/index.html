<html>
    <head>
        <link rel="stylesheet" type="text/css" href="style.css" />
        <title>google sheets flashcards</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <h1>Google Sheets flashcards</h1>
        <p><span id="word"></span></p>
        <p id="answer"></p>
        <button onclick="reveal()">REVEAL (enter)</button>
        <button onclick="correct()">Remembered (Y)</button>
        <button onclick="incorrect()">Not remembered (N)</button>
        <p id="percent"></p>
        <br>
        <div style="border: 2px black solid; width: fit-content; padding: 10px;" class="settings">
            <h3 style="width: fit-content; margin-top: auto;">Settings</h3>
            <p style="width: fit-content;">Give questions from <input type="number" min="1" value="1" id="wordSelection" style="width: 50px;"> to <input type="number" min="1" value="10" id="wordStart" style="width: 50px;"></p>
            <h4 style="margin: auto;">Source</h4>
            <input id="url" value="https://docs.google.com/spreadsheets/d/1va-vgAQicEeWTeDnTDn0N5zSnaG864orTll4vVljJI0/edit?gid=1951687131#gid=1951687131">
            <button id="get" onclick="getData()">retreieve data</button>
            <p id="status"></p>
            <br>
            <button onclick="toggleDark()">Toggle light/dark mode</button>
        </div>
        <a style="position: absolute; bottom: 0px; left: 0px; margin: 10px;" href="./../../index.html" class="return">Return to homepage</a>
        <div class="side">
            <h2>Incorrect answers</h2>
            <button onclick="clearList()">Clear list</button>
            <p id="wrong"></p>
        </div>
    </body>
    <script src="script.js"></script>
</html>
