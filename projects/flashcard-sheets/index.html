<html>
    <head>
        <link rel="stylesheet" type="text/css" href="style.css" />
        <title>latin vocab tester</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <h1>Google Sheets tester</h1>
        <p>Translate "<span id="word"></span>"</p>
        <p id="mark"></p>
        <p id="percent"></p>
        <br>
        <div style="border: 2px black solid; width: fit-content; padding: 10px;" class="settings">
            <h3 style="width: fit-content; margin-top: auto;">Settings</h3>
            <p style="width: fit-content;">Give words from <input type="number" min="1" value="1" id="wordSelection" style="width: 50px;"> to <input type="number" min="1" value="10" id="wordStart" style="width: 50px;"></p>
            <h4 style="margin: auto;">Advanced</h4>
            <button onclick="toggleDark()">Toggle light/dark mode</button>
        </div>
        <a style="position: absolute; bottom: 0px; left: 0px; margin: 10px;" href="./../../index.html" class="return">Return to homepage</a>
        <div class="side">
            <h2>Incorrect words</h2>
            <button onclick="clearList()">Clear list</button>
            <p id="wrong"></p>
        </div>
    </body>
    <script src="./script.js"></script>
</html>
